<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KOЯD</title>
  <link rel="stylesheet" href="style.css">   <!-- design -->
</head>
<body>
<div class="app">

  <div class="top">
    <!-- 1. SIDEBAR: logo, navigation, playlists -->
    <aside class="side">
      <div class="box">
        <div class="logo">KOЯD</div>
        <nav class="nav">
          <button class="on" data-view="home"><i>⌂</i> Home</button>
          <button data-view="search"><i>⌕</i> Search</button>
          <button data-view="library"><i>▤</i> Your Library</button>
        </nav>
      </div>
      <div class="box lib">
        <h3>Playlists</h3>
        <button class="libitem" data-view="playlist">
          <div class="cover" style="background:linear-gradient(135deg,#e5239d,#3a0a2b)"></div>
          <div><b>Nu Metal Essentials</b><small>Playlist · KOЯD</small></div>
        </button>
      </div>
    </aside>

    <!-- 2. MAIN SCREEN: filled by script.js (home, playlist, search, library) -->
    <main class="box main" id="main"></main>

    <!-- 3. FULL-SCREEN LYRICS VIEW: opens with the lyrics button -->
    <section class="lyrics" id="lyrics" aria-hidden="true" aria-label="Now playing lyrics">
      <div class="lyrics-top">
        <button class="icon lyrics-back" id="lyr-close" aria-label="Close lyrics">⌄</button>
        <div class="lyrics-heading"><small>NOW PLAYING</small><b id="lyr-title">Lyrics</b></div>
        <span class="lyrics-spacer"></span>
      </div>
      <div class="lyrics-body">
        <div class="lyrics-art" id="lyr-art">KOЯD</div>
        <div class="lyrics-song-info"><h2 id="lyr-song-title">Choose a song</h2><p id="lyr-artist">Lyrics will follow the music as it plays.</p></div>
        <div class="lines" id="lines"><p>Play a song to see lyrics.</p></div>
      </div>
    </section>
  </div>

  <!-- 4. PLAYER BAR -->
  <footer class="box player">
    <div class="now" id="now"></div>
    <div class="center">
      <div class="ctrls">
        <button class="icon opt" id="shuf" title="Shuffle">⤮</button>
        <button class="icon" id="prev" title="Previous">⏮</button>
        <button class="pp" id="pp" title="Play">▶</button>
        <button class="icon" id="next" title="Next">⏭</button>
        <button class="icon opt" id="rep" title="Repeat">↻</button>
      </div>
      <div class="bar"><span id="cur">0:00</span><div class="track" id="track"><div class="fill" id="fill"></div></div><span id="tot">0:00</span></div>
    </div>
    <div class="vol"><button class="icon" id="lyr-btn" title="Lyrics">🎤</button><input type="range" id="vol" min="0" max="100" value="70"></div>
  </footer>
</div>

<script src="songs.js"></script>   <!-- the song list -->
<script src="script.js"></script>  <!-- how the app works -->
</body>
</html>
